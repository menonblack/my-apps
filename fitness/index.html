<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { color-scheme: dark light; --bg:#0e1116; --fg:#e6edf3; --accent:#14b8a6; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --fg:#0e1116; --accent:#0d9488; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: system-ui, sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); text-align:center; }
  h1 { font-family: "Roboto Condensed","Arial Narrow",sans-serif; font-stretch:condensed; color:var(--accent); font-size:2.5rem; margin:0 0 8px; }
  p { opacity:.8; }
  #install { font: 600 1.2rem system-ui; background:var(--accent); color:#04201d; border:0; border-radius:14px; padding:16px 28px; min-height:56px; margin-top:12px; }
  #hint { max-width: 22rem; line-height:1.5; }
  #status { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>Lift Log</h1>
  <p>Hello world — install test build.</p>
  <p id="status">Checking offline support…</p>
  <button id="install" hidden>Install Lift Log</button>
  <p id="hint" hidden>To install: tap Chrome's ⋮ menu (top right) → <b>Add to Home screen</b> → <b>Install</b>.</p>
</main>
<script>
  const s = document.getElementById('status');
  const standalone = matchMedia('(display-mode: standalone)').matches;
  const btn = document.getElementById('install'), hint = document.getElementById('hint');
  let deferred = null;
  if (!standalone) hint.hidden = false;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; btn.hidden = false; hint.hidden = true; });
  btn.addEventListener('click', async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; btn.hidden = true; });
  addEventListener('appinstalled', () => { btn.hidden = true; hint.hidden = true; s.textContent = 'Installed ✓ — open Lift Log from your home screen'; });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
      .then(() => { s.textContent = (standalone ? 'Running as installed app' : 'Running in browser') + ' · offline ready ✓'; })
      .catch((e) => { s.textContent = 'Service worker failed: ' + e.message; });
  } else s.textContent = 'No service worker support';
</script>
</body>
</html>
